name: Where Winds Meet Companion — Deploy
on:
  push:
    branches: [where-winds-meet-companion]
    paths:
      - 'where-winds-meet-companion/**'
      - '.github/workflows/where-winds-meet-companion.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-wwm-companion
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application files
        run: |
          test -s where-winds-meet-companion/index.html
          test -s where-winds-meet-companion/styles.css
          test -s where-winds-meet-companion/app.js
          node --check where-winds-meet-companion/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: where-winds-meet-companion
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
