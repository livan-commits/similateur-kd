name: Where Winds Meet Companion — Validate
on:
  push:
    branches: [where-winds-meet-companion]
    paths:
      - 'where-winds-meet-companion/**'
      - '.github/workflows/where-winds-meet-companion.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wwm-companion-validate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application files
        run: |
          test -s where-winds-meet-companion/index.html
          test -s where-winds-meet-companion/styles.css
          test -s where-winds-meet-companion/app.js
          test -s where-winds-meet-companion/account.js
          test -s where-winds-meet-companion/supabase-config.js
          test -s where-winds-meet-companion/manifest.webmanifest
          test -s where-winds-meet-companion/service-worker.js
          test -s where-winds-meet-companion/CONNEXIONS.md
          test -s where-winds-meet-companion/supabase/schema.sql
          grep -q 'enable row level security' where-winds-meet-companion/supabase/schema.sql
          grep -q 'auth.uid()' where-winds-meet-companion/supabase/schema.sql
          ! grep -qi 'xbox' where-winds-meet-companion/index.html
          ! grep -qi 'xbox' where-winds-meet-companion/app.js
          node --check where-winds-meet-companion/app.js
          node --check where-winds-meet-companion/account.js
          node --check where-winds-meet-companion/supabase-config.js
          node --check where-winds-meet-companion/service-worker.js
      - name: Package companion website
        uses: actions/upload-artifact@v4
        with:
          name: where-winds-meet-companion-web
          path: where-winds-meet-companion/
          if-no-files-found: error
          retention-days: 30
