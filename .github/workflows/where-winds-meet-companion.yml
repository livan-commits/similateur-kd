name: Where Winds Meet Companion — Validate
on:
  push:
    branches: [where-winds-meet-companion]
    paths:
      - 'where-winds-meet-companion/**'
      - '.github/workflows/where-winds-meet-companion.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wwm-companion-validate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application files
        run: |
          test -s where-winds-meet-companion/index.html
          test -s where-winds-meet-companion/styles.css
          test -s where-winds-meet-companion/app.js
          test -s where-winds-meet-companion/account.js
          test -s where-winds-meet-companion/supabase-config.js
          test -s where-winds-meet-companion/manifest.webmanifest
          test -s where-winds-meet-companion/icon.svg
          test -s where-winds-meet-companion/vercel.json
          node -e 'JSON.parse(require("fs").readFileSync("where-winds-meet-companion/vercel.json","utf8"))'
          node -e 'const m=JSON.parse(require("fs").readFileSync("where-winds-meet-companion/manifest.webmanifest","utf8")); if(!m.icons?.some(i=>i.src==="./icon.svg")) process.exit(1)'
          test -s where-winds-meet-companion/service-worker.js
          test -s where-winds-meet-companion/CONNEXIONS.md
          test -s where-winds-meet-companion/supabase/schema.sql
          grep -q 'enable row level security' where-winds-meet-companion/supabase/schema.sql
          grep -q 'auth.uid()' where-winds-meet-companion/supabase/schema.sql
          ! grep -qi 'xbox' where-winds-meet-companion/index.html
          ! grep -qi 'xbox' where-winds-meet-companion/app.js
          grep -q 'embed/maps/' where-winds-meet-companion/app.js
          grep -q 'The Hidden Gaming Lair' where-winds-meet-companion/app.js
          node --check where-winds-meet-companion/app.js
          node --check where-winds-meet-companion/account.js
          node --check where-winds-meet-companion/supabase-config.js
          node --check where-winds-meet-companion/service-worker.js
          node where-winds-meet-companion/tests/account-merge.test.cjs
      - name: Browser smoke tests
        run: |
          npm install --prefix /tmp/wwm-playwright playwright
          /tmp/wwm-playwright/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 4173 --directory where-winds-meet-companion >/tmp/wwm-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          NODE_PATH=/tmp/wwm-playwright/node_modules node where-winds-meet-companion/tests/browser-smoke.cjs
      - name: Package companion website
        uses: actions/upload-artifact@v4
        with:
          name: where-winds-meet-companion-web
          path: where-winds-meet-companion/
          if-no-files-found: error
          retention-days: 30
