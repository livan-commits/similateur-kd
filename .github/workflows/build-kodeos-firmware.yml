name: Build KodeOS ESP32-P4 firmware

on:
  workflow_dispatch:
  push:
    branches: [main, web-psram-bridge-final]
    paths:
      - ".github/workflows/build-kodeos-firmware.yml"
      - "patches/headless_display.py"

permissions:
  contents: read

concurrency:
  group: kodeos-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout official KodeOS and its pinned submodules
        uses: actions/checkout@v4
        with:
          repository: kodediy/KodeOS
          ref: d2443ddc07b238a24f1f4ebe1b0b8e4a09f34b1d
          submodules: recursive
          fetch-depth: 1

      - name: Checkout simulator build overlays
        uses: actions/checkout@v4
        with:
          path: simulator

      - name: Verify the SDK commit pinned by this project
        shell: bash
        run: |
          set -euo pipefail
          expected="66f2a597596c7f19d651207158be9efe305fdf33"
          actual="$(git -C sdk rev-parse HEAD)"
          echo "KodeOS commit: $(git rev-parse HEAD)"
          echo "Expected SDK:  $expected"
          echo "Actual SDK:    $actual"
          test "$actual" = "$expected"

      - name: Enable the real KGUI framebuffer without physical MIPI-DSI
        run: python3 simulator/patches/headless_display.py "$GITHUB_WORKSPACE"

      - name: Build the pinned ESP32-C5 coprocessor firmware
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v6.1
          target: esp32c5
          command: bash tools/build_c5.sh

      - name: Build KodeOS and merge the complete ESP32-P4 flash image
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v6.1
          target: esp32p4
          command: |
            set -euo pipefail
            idf.py build
            (
              cd build
              python -m esptool --chip esp32p4 merge-bin -o kodeos-flash.bin -f raw @flash_args 0x1800000 storage.bin
            )
            {
              echo "KodeOS source: $(git rev-parse HEAD)"
              echo "KodeOS SDK: $(git -C sdk rev-parse HEAD)"
              echo "C5 source: $(git -C sdk/c5 rev-parse HEAD)"
              echo "C5 stamp: $(cat storage_image/c5_slave.commit)"
              echo "ESP-IDF: v6.1"
              echo "Target: esp32p4"
              echo "Application: build/kodeos.bin"
              echo "Storage image: build/storage.bin at 0x1800000"
              echo "Merged flash: build/kodeos-flash.bin"
            } > build/firmware-build-info.txt
            test -s build/kodeos.bin
            test -s build/storage.bin
            test -s build/kodeos-flash.bin
            ls -lh build/kodeos.bin build/storage.bin build/kodeos-flash.bin

      - name: Export and verify real KGUI framebuffer symbols
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/elf-tools
          /tmp/elf-tools/bin/pip install pyelftools
          /tmp/elf-tools/bin/python simulator/patches/export_framebuffer_symbols.py build/kodeos.elf framebuffer-symbols.json
          test -s framebuffer-symbols.json

      - name: Verify the actual console transport selected by ESP-IDF
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cfg = Path("sdkconfig").read_text()
          keys = ("CONFIG_ESP_CONSOLE_UART=", "CONFIG_ESP_CONSOLE_UART_DEFAULT=", "CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=", "CONFIG_ESP_CONSOLE_UART_NUM=", "CONFIG_KHAL_CONSOLE_DOCK=", "CONFIG_KODEOS_CONSOLE=")
          for line in cfg.splitlines():
              if line.startswith(keys):
                  print(line)
          assert "CONFIG_ESP_CONSOLE_UART_DEFAULT=y" in cfg
          assert not any(line.startswith("CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=") and line.endswith("=y") for line in cfg.splitlines())
          assert "CONFIG_ESP_CONSOLE_UART=y" in cfg
          PY

      - name: Download and verify ESP-EMU v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          archive="esp-emu-1.0.0-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/espressif/esp-emulator/releases/download/v1.0.0"
          curl -fsSL "$base/$archive" -o "/tmp/$archive"
          curl -fsSL "$base/SHA256SUMS" -o /tmp/esp-emu-SHA256SUMS
          grep "  $archive\$" /tmp/esp-emu-SHA256SUMS > /tmp/esp-emu-checksum
          (cd /tmp && sha256sum -c esp-emu-checksum)
          mkdir -p /tmp/esp-emu-release
          tar -xzf "/tmp/$archive" -C /tmp/esp-emu-release
          emulator="$(find /tmp/esp-emu-release -type f -name esp-emu -perm -u+x -print -quit)"
          test -n "$emulator"
          echo "$emulator" > /tmp/esp-emu-path
          "$emulator" --help > /tmp/esp-emu-help.txt
          sed -n '1,25p' /tmp/esp-emu-help.txt

      - name: Boot the real KodeOS flash image in ESP-EMU
        shell: bash
        run: |
          set -uo pipefail
          emulator="$(cat /tmp/esp-emu-path)"
          logfile="$RUNNER_TEMP/esp-emu-boot.log"
          now_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          time_payload="$(printf '%s\n' "time set=\"$now_utc\"" "time"; printf 'X')"
          time_payload="${time_payload%X}"
          set +e
          "$emulator" \
            --chip esp32p4 \
            --firmware build/kodeos-flash.bin \
            --elf build/kodeos.elf \
            --psram-size 32M \
            --i2c-dev 0:0x20 \
            --i2c-dev 0:0x15,fill=0,reg=0xa7=0xb7 \
            --inject-on "console up ('help' for commands)" \
            --inject "$time_payload" \
            --timeout 30s 2>&1 | tee "$logfile"
          status="${PIPESTATUS[0]}"
          set -e
          echo "ESP-EMU exit code: $status"
          echo "===== UART / emulator boot log ====="
          cat "$logfile"
          if [ "$status" -ne 0 ]; then
            echo "::error::ESP-EMU diagnostic boot did not finish cleanly (exit $status)"
            exit "$status"
          fi
          test -s "$logfile"
          if ! grep -F "hardware " "$logfile"; then
            echo "::error::The KodeOS hardware boot banner was not observed on the ESP-EMU UART."
            exit 1
          fi
          if ! grep -F "sdk " "$logfile"; then
            echo "::error::The KodeOS SDK boot banner was not observed on the ESP-EMU UART."
            exit 1
          fi
          echo "Confirmed: KodeOS reached kode_banner_print(); full 30-second UART trace captured with virtual I2C ACK devices."
          if ! grep -F "|time state=known" "$logfile"; then
            echo "::error::The KodeOS time command did not accept the delayed UTC sync over UART0."
            exit 1
          fi
          echo "Confirmed: KodeOS accepted the UTC wall-clock command over UART0."
          echo "Confirmed: the live framebuffer symbols are exported for direct ESP-EMU memory reads."

      - name: Publish ESP-EMU boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodeos-esp32p4-esp-emu-boot-log
          path: ${{ runner.temp }}/esp-emu-boot.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish firmware build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodeos-esp32p4-firmware
          path: |
            build/kodeos-flash.bin
            build/kodeos.bin
            build/storage.bin
            build/kodeos.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flash_args
            build/firmware-build-info.txt
          if-no-files-found: error
          retention-days: 30
