name: Build and publish KodeOS Web Emulator

on:
  push:
    branches: [main, web-framebuffer-bridge, web-psram-bridge-final]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this project
        uses: actions/checkout@v4

      - name: Validate firmware workflow YAML syntax
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/build-kodeos-firmware.yml")'

      - name: Checkout official KodeOS sources
        uses: actions/checkout@v4
        with:
          repository: kodediy/KodeOS
          ref: 9bcfdb71b763ee7b5c14106358643ea611fc97db
          path: upstream
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned SDK revision
        shell: bash
        run: |
          expected="1841cc8c13d4b2e3e4d7288b40cdac5de207a133"
          actual="$(git -C upstream/sdk rev-parse HEAD)"
          echo "Expected SDK: $expected"
          echo "Actual SDK:   $actual"
          test "$actual" = "$expected"

      - name: Build the pinned ESP32-C5 coprocessor firmware
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          path: upstream
          esp_idf_version: v6.1
          target: esp32c5
          command: bash tools/build_c5.sh

      - name: Enable the real KGUI framebuffer without physical MIPI-DSI
        run: python3 patches/headless_display.py upstream

      - name: Build the actual KodeOS ESP32-P4 firmware and storage image
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          path: upstream
          esp_idf_version: v6.1
          target: esp32p4
          command: |
            set -euo pipefail
            idf.py build
            (
              cd build
              python -m esptool --chip esp32p4 merge-bin -o kodeos-flash.bin -f raw @flash_args 0x1800000 storage.bin
            )
            test -s build/kodeos.bin
            test -s build/storage.bin
            test -s build/kodeos-flash.bin
            ls -lh build/kodeos.bin build/storage.bin build/kodeos-flash.bin

      - name: Verify the actual console transport selected by ESP-IDF
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cfg = Path("upstream/sdkconfig").read_text()
          keys = ("CONFIG_ESP_CONSOLE_UART=", "CONFIG_ESP_CONSOLE_UART_DEFAULT=", "CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=", "CONFIG_ESP_CONSOLE_UART_NUM=", "CONFIG_KHAL_CONSOLE_DOCK=", "CONFIG_KODEOS_CONSOLE=")
          for line in cfg.splitlines():
              if line.startswith(keys):
                  print(line)
          assert "CONFIG_ESP_CONSOLE_UART_DEFAULT=y" in cfg
          assert not any(line.startswith("CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=") and line.endswith("=y") for line in cfg.splitlines())
          assert "CONFIG_ESP_CONSOLE_UART=y" in cfg
          PY

      - name: Export KGUI framebuffer symbols from the real firmware ELF
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/elf-tools
          /tmp/elf-tools/bin/pip install pyelftools
          /tmp/elf-tools/bin/python patches/export_framebuffer_symbols.py upstream/build/kodeos.elf framebuffer-symbols.json
          test -s framebuffer-symbols.json

      - name: Download ESP-EMU v1.0.0 browser runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="esp-emu-1.0.0-wasm.tar.gz"
          base="https://github.com/espressif/esp-emulator/releases/download/v1.0.0"
          curl -fsSL "$base/$archive" -o "/tmp/$archive"
          curl -fsSL "$base/SHA256SUMS" -o /tmp/esp-emu-SHA256SUMS
          grep "  $archive\$" /tmp/esp-emu-SHA256SUMS > /tmp/esp-emu-checksum
          (cd /tmp && sha256sum -c esp-emu-checksum)
          mkdir -p /tmp/esp-emu-release dist/esp-emu
          tar -xzf "/tmp/$archive" -C /tmp/esp-emu-release
          www_dir="$(find /tmp/esp-emu-release -type d -name www -print -quit)"
          test -n "$www_dir"
          cp -a "$www_dir"/. dist/esp-emu/

      - name: Validate official ESP-EMU memory and UART APIs
        shell: bash
        run: |
          node --input-type=module <<'JS'
          try {
            const api = await import("./dist/esp-emu/pkg/esp_emu.js");
            console.log("ESP-EMU exports:", Object.keys(api));
            const proto = api.WasmEmulator.prototype;
            const names = Object.getOwnPropertyNames(proto);
            console.log("ESP-EMU complete WasmEmulator API:", names);
            for (const name of names) {
              if (/uart|psram|console|input|write|send|load|run|reset|read|memory|ram|peek|dump/i.test(name)) {
                const fn = proto[name];
                console.log(name + "(" + fn.length + "): " + String(fn).slice(0, 900));
              }
            }
            if (typeof proto.uart_input !== "function") throw new Error("ESP-EMU UART input API missing");
            if (typeof proto.read_memory !== "function") throw new Error("ESP-EMU direct memory read API missing");
          } catch (error) {
            console.error("Node API introspection failed:", error.stack || error);
            throw error;
          }
          JS

      - name: Checkout official ESP-EMU v1.0.0 virtual-part SDK
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-emulator
          ref: v1.0.0
          path: .cache/esp-emulator-src
          fetch-depth: 1

      - name: Build the Kode Dot I2C virtual board part
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Compile Kode Dot I2C virtual board to WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$PWD/.cache/cargo-target"
          cargo test --manifest-path parts/kode_board/Cargo.toml
          cargo build --release --target wasm32-unknown-unknown --manifest-path parts/kode_board/Cargo.toml
          mkdir -p dist/esp-emu/parts
          cp "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/kode_board.wasm" dist/esp-emu/parts/
          test -s dist/esp-emu/parts/kode_board.wasm

      - name: Syntax-check the browser worker
        shell: bash
        run: |
          node --input-type=module --check < web/kodeos-worker.js

      - name: Prepare single-page KodeOS web emulator
        shell: bash
        run: |
          mkdir -p dist/firmware
          cp upstream/build/kodeos-flash.bin dist/firmware/
          cp framebuffer-symbols.json dist/framebuffer-symbols.json
          cp web/index.html dist/index.html
          cp web/kodeos-worker.js dist/kodeos-worker.js
          touch dist/.nojekyll

      - name: Write source manifest
        shell: bash
        run: |
          cat > dist/versions.json <<EOF
          {
            "project": "similateur-kd",
            "kodeos_source_commit": "9bcfdb71b763ee7b5c14106358643ea611fc97db",
            "kodeos_sdk_commit": "1841cc8c13d4b2e3e4d7288b40cdac5de207a133",
            "renderer": "official ESP-EMU browser runtime executing pinned KodeOS ESP32-P4 firmware; real KGUI RGB565 framebuffer read directly from the firmware's PSRAM through ESP-EMU read_memory",
            "firmware": "KodeOS ESP32-P4 merged flash image including storage at 0x1800000; simulator-only headless display overlay",
            "c5": "KodeOS-pinned ESP32-C5 coprocessor firmware included in storage; C5 runtime not yet separately emulated in this web build",
            "esp_emu": "v1.0.0",
            "display": "410x502 RGB565 framebuffer rendered by real KGUI and polled from PSRAM by a dedicated Web Worker using ELF-exported symbols; CO5300 MIPI-DSI bypassed",
            "virtual_parts": "TCA6408A at I2C 0x20 and CST820 at I2C 0x15; GPIO5 SCL, GPIO4 SDA, GPIO6 IRQ, TOP key on GPIO35"
          }
          EOF
          cat dist/versions.json

      - name: Validate single-page web emulator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/versions.json").read_text())
          assert manifest["kodeos_sdk_commit"] == "1841cc8c13d4b2e3e4d7288b40cdac5de207a133"
          assert "ESP-EMU" in manifest["renderer"] and "real KGUI" in manifest["renderer"]
          symbols = json.loads(Path("dist/framebuffer-symbols.json").read_text())
          assert symbols["width"] == 410 and symbols["height"] == 502
          assert symbols["bytes_per_pixel"] == 2 and symbols["max_read_bytes"] == 4096
          for key in ("front_pointer_address", "sequence_address", "dirty_y1_address", "dirty_y2_address"):
              assert int(symbols[key], 16) > 0
          for name in ("framebuffer-symbols.json", "index.html", "kodeos-worker.js", "versions.json", "firmware/kodeos-flash.bin", "esp-emu/index.html", "esp-emu/app.js", "esp-emu/worker.js", "esp-emu/pkg/esp_emu.js", "esp-emu/pkg/esp_emu_bg.wasm", "esp-emu/cosim.js", "esp-emu/part-worker.js", "esp-emu/vendor/esp_cosim_pb.js", "esp-emu/parts/kode_board.wasm"):
              path = Path("dist") / name
              assert path.is_file() and path.stat().st_size > 0, name
              print(f"OK {path} ({path.stat().st_size} bytes)")
          html = Path("dist/index.html").read_text()
          assert 'name="viewport"' in html
          assert "kodeos-worker.js" in html
          assert "CosimPump" not in html
          assert 'id="screen"' in html
          worker = Path("dist/kodeos-worker.js").read_text()
          assert "time set=" in worker
          assert "uart_input" in worker
          assert "read_memory(" in worker
          assert "framebuffer-symbols.json" in worker
          assert "kode_board.wasm" in worker
          assert "screenshot dst=console" not in html + worker
          assert "kodeos-flash.bin" in worker
          assert "esp-emu/index.html" not in html
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web emulator
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish web emulator
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    steps:
      - name: Checkout smoke test
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          npm install --prefix /tmp/kd-smoke playwright@1.55.0
          /tmp/kd-smoke/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify the public KodeOS boot, UTC clock and real KGUI framebuffer
        shell: bash
        env:
          KD_SITE_URL: https://livan-commits.github.io/similateur-kd/
          PLAYWRIGHT_MODULE: /tmp/kd-smoke/node_modules/playwright/index.mjs
        run: node scripts/smoke-web.mjs

      - name: Upload browser smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodeos-web-smoke
          path: /tmp/kodeos-web-smoke.png
          if-no-files-found: ignore
