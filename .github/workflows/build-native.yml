name: Build native KGUI host simulator

on:
  push:
    branches: [main]
    paths:
      - "ports/native/**"
      - "patches/native_host.py"
      - ".github/workflows/build-native.yml"
      - "docs/native-host-simulator.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-host
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout simulator project
        uses: actions/checkout@v4

      - name: Checkout official KodeOS sources and pinned SDK
        uses: actions/checkout@v4
        with:
          repository: kodediy/KodeOS
          ref: 9bcfdb71b763ee7b5c14106358643ea611fc97db
          path: upstream
          submodules: recursive
          fetch-depth: 1

      - name: Verify SDK pin
        shell: bash
        run: |
          expected="1841cc8c13d4b2e3e4d7288b40cdac5de207a133"
          actual="$(git -C upstream/sdk rev-parse HEAD)"
          echo "Expected SDK: $expected"
          echo "Actual SDK:   $actual"
          test "$actual" = "$expected"

      - name: Install native SDL2 dependencies (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake pkg-config libsdl2-dev

      - name: Install native SDL2 dependencies (Windows, MinGW64)
        if: matrix.name == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libsdl2
            mingw-w64-x86_64-pkgconf

      - name: Select official KGUI screens for native host profile (Linux)
        if: matrix.name == 'linux'
        run: python3 patches/native_host.py upstream/sdk "$GITHUB_WORKSPACE"

      - name: Select official KGUI screens for native host profile (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: python patches/native_host.py upstream/sdk "$(cygpath -m "$PWD")"

      - name: Configure native KGUI simulator (Linux)
        if: matrix.name == 'linux'
        run: |
          cmake -S upstream/components/kgui/sim -B build-native \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Configure native KGUI simulator (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: |
          cmake -G Ninja -S upstream/components/kgui/sim -B build-native \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compile official KGUI simulator (Linux)
        if: matrix.name == 'linux'
        run: cmake --build build-native --parallel 2

      - name: Compile official KGUI simulator (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: cmake --build build-native --parallel 2

      - name: Bundle the SDL2 runtime DLL (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: cp /mingw64/bin/SDL2.dll build-native/

      - name: Upload native simulator executable (Linux)
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: kgui-native-linux
          path: build-native/kgui_sim
          if-no-files-found: error

      - name: Upload native simulator executable (Windows)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: kgui-native-windows
          path: |
            build-native/kgui_sim.exe
            build-native/SDL2.dll
          if-no-files-found: error
