name: Kode Dot firmware build
on:
  push:
    paths:
      - 'spotify-remote/kode/**'
      - '.github/workflows/spotify-remote-kode.yml'
  pull_request:
    paths:
      - 'spotify-remote/kode/**'
      - '.github/workflows/spotify-remote-kode.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    defaults:
      run:
        shell: bash
        working-directory: spotify-remote/kode
    steps:
      - uses: actions/checkout@v4
      - name: Build Kode Dot firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: spotify-remote-kode-firmware
          path: spotify-remote/kode/build/spotify_remote.bin
          if-no-files-found: error
