name: Build Android local simulator

on:
  workflow_run:
    workflows: ["Build and publish KodeOS Web Emulator"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  android-apk:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact simulator revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download the validated offline web runtime
        uses: actions/download-artifact@v4
        with:
          name: kode-dot-web-dist
          path: /tmp/kode-dot-web-dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Package firmware, WebAssembly and workers into Android assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/site
          cp -a /tmp/kode-dot-web-dist/. android/app/src/main/assets/site/
          test -s android/app/src/main/assets/site/index.html
          test -s android/app/src/main/assets/site/firmware/kodeos-flash.bin
          test -s android/app/src/main/assets/site/esp-emu/pkg/esp_emu_bg.wasm
          du -sh android/app/src/main/assets/site

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kode-dot-local-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
