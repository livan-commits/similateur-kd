name: Android companion build
on:
  push:
    paths:
      - 'spotify-remote/android/**'
      - '.github/workflows/spotify-remote-android.yml'
  pull_request:
    paths:
      - 'spotify-remote/android/**'
      - '.github/workflows/spotify-remote-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p spotify-remote/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kode-spotify-remote-debug
          path: spotify-remote/android/app/build/outputs/apk/debug/app-debug.apk
